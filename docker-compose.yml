services:
  web:
    image: nginx:1.27-alpine
    ports:
      - "${WEB_PORT}:80"
    volumes:
      - ./html:/usr/share/nginx/html:ro
    labels:
      deploy.entry: "80"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:80/"]
      interval: 5s
      timeout: 3s
      retries: 5

